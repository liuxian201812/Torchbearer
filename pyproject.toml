[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchbearer-framework"
version = "0.3.2"
description = "A reference framework for autonomous, coordinated scientific agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
torchbearer = "torchbearer.__main__:main"
torchbearer-mcp = "torchbearer.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
